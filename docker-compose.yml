services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: koperasi_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - koperasi_network
    depends_on:
      - mysql
    ports:
      - "8000:8000"

  mysql:
    image: mysql:8.0
    container_name: koperasi_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-koperasi_db}
      MYSQL_USER: ${MYSQL_USER:-koperasi_user}
      # ponytail: tanpa default; compose gagal bila env kosong. Isi via secret aaPanel.
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?wajib isi MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?wajib isi MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - koperasi_mysql_data:/var/lib/mysql
    networks:
      - koperasi_network

  node:
    image: node:20-alpine
    container_name: koperasi_node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host"
    networks:
      - koperasi_network

  baileys:
    build:
      context: ./baileys-service
    container_name: koperasi_baileys
    restart: unless-stopped
    environment:
      TOKEN: ${BAILEYS_TOKEN:?wajib isi BAILEYS_TOKEN}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - koperasi_baileys_session:/app/session
    networks:
      - koperasi_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: koperasi_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: php artisan queue:listen --tries=1 --timeout=0
    depends_on:
      - mysql
    networks:
      - koperasi_network

networks:
  koperasi_network:
    driver: bridge

volumes:
  koperasi_mysql_data:
    driver: local
  koperasi_baileys_session:
    driver: local